name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none

      - run: composer install --no-interaction --no-progress

      # Without php_stats, the descriptive helpers use pure PHP and the model
      # tests are skipped.
      - run: vendor/bin/pest

  polars:
    # phplyr on phibble's PolarsTable, with the prebuilt php_polars extension
    # from the phpolars release (Linux, PHP 8.5 NTS, glibc >= 2.36).
    runs-on: ubuntu-24.04
    env:
      PHPOLARS_VERSION: v0.1.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Install php_polars
        run: |
          gh release download "$PHPOLARS_VERSION" -R erikwestlund/phpolars --pattern 'php_polars-*-x86_64-nts-bookworm.*'
          sha256sum -c php_polars-*.sha256
          tar -xzf php_polars-*.tar.gz
          sudo cp php_polars-*/php_polars.so "$(php-config --extension-dir)/"
          echo "extension=php_polars.so" | sudo tee "$(php -r "echo PHP_CONFIG_FILE_SCAN_DIR;")/90-php_polars.ini"
          php -r 'echo Phpolars\version(), "\n";'

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/pest tests/PolarsTest.php
