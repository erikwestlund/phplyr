name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none

      - run: composer install --no-interaction --no-progress

      # Without php_stats, the descriptive helpers use pure PHP and the model
      # tests are skipped.
      - run: vendor/bin/pest
